name: CI and Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint:check
      - run: npm test
      - run: npm run build
      - run: npm run verify:build
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import pkg from "./package.json" with {type:"json"}; if (process.env.RELEASE_TAG !== `v${pkg.version}`) process.exit(1)'
      - uses: actions/upload-artifact@v4
        with:
          name: paper2speech-xpi
          if-no-files-found: error
          path: |
            .scaffold/build/*.xpi
            .scaffold/build/update.json

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paper2speech-xpi
          path: dist
      - name: Publish version and automatic update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Paper2Speech $RELEASE_TAG" --generate-notes --latest
          fi
          gh release upload "$RELEASE_TAG" dist/paper-2-speech.xpi dist/update.json --clobber
          if ! gh release view release >/dev/null 2>&1; then
            gh release create release --target "$RELEASE_SHA" --title "Automatic update feed" --notes "Stable update metadata for Zotero. Install the XPI from the latest versioned release." --prerelease --latest=false
          fi
          gh release upload release dist/update.json --clobber
